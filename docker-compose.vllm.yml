services:
  vllm:
    image: vllm/vllm-openai:latest
    container_name: vllm-qwen
    runtime: nvidia
    restart: unless-stopped
    ports:
      - "8000:8000"
    ipc: host
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
    volumes:
      # Mount cache directory to avoid re-downloading model weights on restart
      - huggingface-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: >
      Qwen/Qwen2.5-7B-Instruct-GPTQ-Int4
      --host 0.0.0.0
      --port 8000
      --gpu-memory-utilization 0.70
      --max-model-len 4096

volumes:
  huggingface-cache:
    name: vllm_huggingface_cache
